name: Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
    # Rebuild SPA when app, assets, or toolchain change — skip pure docs/license noise
    paths:
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'scripts/**'
      - 'assets-masters/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'svelte.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      rebuild_sounds:
        description: 'Fetch/encode core sound pack with ffmpeg before build'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to rebuild sounds
        id: sounds
        run: |
          # Committed .ogg binaries are present in public/sounds/core/*.ogg.
          # Skip rebuild on push when committed binaries are present.
          HAS_BINARIES=false
          if [ -f public/sounds/core/rain_light.ogg ]; then
            HAS_BINARIES=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rebuild_sounds }}" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding sounds: forced via workflow_dispatch"
          elif [ "$HAS_BINARIES" = "false" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding sounds: binary assets missing from checkout"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Skipping sound rebuild (committed .ogg binaries present)"
          fi

      - name: Install ffmpeg
        if: steps.sounds.outputs.rebuild == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (uses built-in node:sqlite)
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild core sound pack
        if: steps.sounds.outputs.rebuild == 'true'
        run: pnpm sounds:freesound

      - name: Validate sound catalog & manifests
        run: pnpm validate-manifests

      - name: Run type & syntax checks
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build Vite application
        run: pnpm build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
